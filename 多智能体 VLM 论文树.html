add({id:'d_vif',s:'ViF 视觉流',t:'Visual Multi-Agent System: Mitigating Hallucination Snowballing via Visual Flow',au:'Yu, Xu, Zhang, He, Chen, Xue, Zhang, Liao, Hu, Jiang, Yan',yr:2026,ven:'arXiv 2025-09,v3 2026-01',url:ax('2509.21789'),tier:1,ord:4,ver:'A',kw:'hallucination snowballing visual flow attention vmas',
 why:'第一个把「视觉多智能体特有的失败」讲清楚的工作:幻觉被后续智能体放大。方法轻量、插件式,先读它再读 L²-VMAS 最顺。',
 p:'VLM 多智能体里出现新的失败形式「视觉幻觉滚雪球」:一个智能体产生的幻觉被后面的智能体放大,因为视觉信息只靠文本在智能体之间传递。',
 m:'先做轮次、层、token 三个维度的注意力分析,发现对视觉的注意力会随智能体轮次下降;并找出中间层里注意力呈单峰、最能保存视觉证据的一小部分视觉 token。ViF 用这些视觉中继 token 来传递智能体间消息,并做注意力重分配来强化这个模式。轻量、即插即用。',
 r:'在 4 种常见多智能体结构、10 个基础模型、8 个基准上稳定减轻幻觉滚雪球并提升表现(摘要未给具体数字,以论文表格为准)。代码:github.com/YU-deep/ViF。',
 src:'arXiv 2509.21789(v3,2026-01-28),Shuicheng Yan、Xiaobin Hu 团队(NUS 等)。',
 nx:'同组随后做了 L²-VMAS(双隐空间记忆)。Collaborative Memory 也把 ViF 归为「视觉或隐空间的智能体间交换」。'});
add({id:'d_l2',s:'L²-VMAS 双隐空间记忆',t:'Dual Latent Memory for Visual Multi-agent System',au:'Yu, Xu, Chen, Yin, Yang, He, Hu, Zhang, Tan, Hu, Yan',yr:2026,ven:'ICML 2026 (PMLR 306)',url:ax('2602.00471'),tier:1,ord:5,ver:'A',kw:'scaling wall latent memory vmas entropy',
 why:'最核心的一篇:既有「为什么视觉多智能体越协作越差」的实证分析,又给出隐空间记忆方案,涉及 token 成本。想做这个方向,这篇必须能复述并复现。',
 p:'视觉多智能体出现「scaling wall」:增加智能体轮次反而降低精度并让 token 暴涨。在 MMBench + Qwen3-VL-8B-Thinking 上,精度在第 3 轮到峰值(84.8 到 86.6),第 6 轮起低于单智能体,第 10 轮的 token 是单智能体的约 30 倍(557 到 16,840)。原因是文本通信的信息瓶颈,以及感知和思考被混在一起传递。',
 m:'模型无关框架,各智能体骨干冻结,只训练外挂的记忆模块。(1)记忆合成:共享的双隐空间记忆,把感知和思考分开存;感知记忆用三档粒度(局部、区域、全局)的视觉特征,思考记忆按高熵分隔符切块并限制容量(N=50),溢出时按触发率与相似度剪枝合并。(2)记忆编排:基于熵的主动触发,用可学习门(Gumbel-Sigmoid)决定取感知还是思考记忆,取 top-k 后压缩成长度 L=8 的隐记忆再注入。三阶段 PPO 训练,在 GQA 上训练,8 张 H200。',
 r:'5 个骨干、4 种规模、6 种拓扑上,比文本式 VMAS 平均精度高 2.7–5.4%,token 少 21.3–44.8%;多图和视频基准平均提升约 4%;到第 10 轮仍比第 1 轮高 13.6%(Instruct)和 15.1%(Thinking)。消融里去掉「归因」或「思考记忆」掉点最多。个别单元格略有下降(如 LLaVA-OV-1.5-8B 的 MMBench)。',
 src:'arXiv 2602.00471,ICML 2026;NUS、复旦、清华、浙大、上海 AI Lab 等联合,通讯 Xiaobin Hu,末位 Shuicheng Yan。',
 nx:'Collaborative Memory for Multi-Agent VLM Systems 把它称为「dual latent memory」并从共享视觉记忆角度延伸。读时可追问:需要访问隐状态(白盒);需要额外 PPO 训练;GQA 上训练的记忆能否泛化到更复杂场景。'});
add({id:'d_collab',s:'协作记忆(草稿)',t:'Collaborative Memory for Multi-Agent VLM Systems',au:'Zhang, Xia, Wang, Liu, Xiong, Wang',yr:2026,ven:'arXiv 2026-09(4 页初稿)',url:ax('2609.17921'),tier:3,ord:10,ver:'A',kw:'shared visual memory consistency vlm agents',

 p:'多个 VLM 智能体分别看图像不同区域、视频不同帧时,协作不只是分摊推理,还要分摊感知,共享视觉上下文成为核心问题。',
 m:'提出框架,围绕三件事设计:记忆层级、跨智能体共享、一致性机制,让记忆保存观察、解释和后续推理之间的依赖,而不只是图像或文字摘要。',

 {name:'B 基础',desc:'只补缺,不用精读。',children:[

/* 边:[被引用论文, 引用它的论文],均来自已读到的参考文献列表 */
const E=[['d_vif','d_l2'],['e_latentmas','d_l2'],['e_thought','d_l2'],['e_c2c','d_l2'],['c_mast','d_l2'],['b_mad','d_l2'],['b_macnet','d_l2'],['d_bemyeyes','d_l2'],['d_mdoc','d_l2'],['f_viki','d_l2'],['d_mavqa','d_l2'],['d_topdown','d_l2'],['d_pixelcraft','d_l2'],['d_metal','d_l2'],['g_ucagents','d_l2'],['b_qwen3vl','d_l2'],['c_scaling','d_l2'],['c_cowpox','d_l2'],
 ['d_vif','d_collab'],['d_l2','d_collab'],
 ['f_viki','f_meco'],['f_team','f_meco'],['f_coela','f_meco'],['f_roco','f_meco'],['b_metagpt','f_meco'],['b_agentverse','f_meco'],['b_macnet','f_meco'],['s_embodied','f_meco'],['b_qwen3vl','f_meco'],
 ['c_mast','e_thought'],['c_mast','e_interlat']];

const STAGES=[[1,2,'一 建立全景(泛读)'],[3,4,'二 看清问题'],[5,6,'三 精读主线'],[7,11,'四 对照与扩展'],[12,17,'五 按方向选读'],[18,99,'六 泛读备查']];

/* ---------- state ---------- */
const $=s=>document.querySelector(s);
const KEY='mavlm-tree-read-v1';
let read={};try{read=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
const saveRead=()=>{try{localStorage.setItem(KEY,JSON.stringify(read))}catch(e){}};
const state={sel:null,tiers:new Set([1,2,3,4]),q:'',unread:false,edges:false,scale:1,tab:'tree'};
const ALL=Object.values(P).sort((a,b)=>a.ord-b.ord);
const norm=n=>typeof n==='string'?{paper:true,id:n}:n;
function prep(n){n=norm(n);if(n.children)n.children=n.children.map(prep);return n}
const root=prep(TREE);
/* 一级分支默认展开,B 下的二级默认折叠 */
['B2 LLM 多智能体','B1 视觉语言模型'].forEach(()=>{});
function walk(n,f){f(n);(n.children||[]).forEach(c=>walk(c,f))}
walk(root,n=>{if(n.name&&n.name.startsWith('B')&&n.children&&n.children.some(c=>c.children))n.collapsed=false;if(n.name==='B1 视觉语言模型'||n.name==='B2 LLM 多智能体')n.collapsed=true});

/* ---------- cards ---------- */
const tierTag=t=>`<span class="tag t${t}">${TIERS[t].name}</span>`;
function cardHTML(p,full){
  const rel=relOf(p.id);
  return `<div class="card">
   <div>${tierTag(p.tier)}<span class="ord">阅读顺序 #${String(p.ord).padStart(2,'0')}</span>${read[p.id]?'<span class="ord">已读</span>':''}</div>
   <h3>${p.t}</h3><div class="meta">${p.au} · ${p.yr} · ${p.ven}</div>
   <dl>
    <div><dt>建议程度</dt><dd>${TIERS[p.tier].name}(${TIERS[p.tier].time}):${TIERS[p.tier].desc}。${p.why}</dd></div>
    <div><dt>解决什么问题</dt><dd>${p.p}</dd></div>
    <div><dt>方法怎么做</dt><dd>${p.m}</dd></div>
    <div><dt>结果怎么样</dt><dd>${p.r}</dd></div>
    <div><dt>论文从哪里来</dt><dd>${p.src}</dd></div>
    <div><dt>后续还有什么工作</dt><dd>${p.nx}${rel.by.length?'<br>被已核实的引用:'+rel.by.map(i=>P[i].s).join('、'):''}</dd></div>
   </dl>
   <div class="ver">核实状态:<b>${VER[p.ver]}</b></div>
  </div>`;
}
function relOf(id){return{by:E.filter(e=>e[0]===id).map(e=>e[1]),cites:E.filter(e=>e[1]===id).map(e=>e[0])}}
function showPanel(id){
  const p=P[id];state.sel=id;const rel=relOf(id);
  const chips=(arr)=>arr.map(i=>`<button data-go="${i}">${P[i].s}</button>`).join('');
  $('#panel').innerHTML=cardHTML(p,true)+`
   <div class="actions"><a class="btn" href="${p.url}" target="_blank" rel="noopener">打开论文</a>
   <button class="btn ghost" id="bRead" aria-pressed="${!!read[id]}">${read[id]?'取消已读':'标记已读'}</button></div>
   ${rel.cites.length?`<div><div class="meta">它引用了(已核实)</div><div class="rel">${chips(rel.cites)}</div></div>`:''}
   ${rel.by.length?`<div><div class="meta">被这些论文引用(已核实)</div><div class="rel">${chips(rel.by)}</div></div>`:''}`;
  $('#bRead').onclick=()=>{read[id]=!read[id];if(!read[id])delete read[id];saveRead();refresh();showPanel(id)};
  $('#panel').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>select(b.dataset.go));
  if(matchMedia('(max-width:980px)').matches)$('#panel').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function select(id){showPanel(id);drawTree();renderRoute()}

/* ---------- tooltip ---------- */
const tt=$('#tt');
const canHover=!matchMedia('(hover:none)').matches;
function moveTT(ev){
  const w=tt.offsetWidth,h=tt.offsetHeight,vw=innerWidth,vh=innerHeight;
  let x=ev.clientX+18,y=ev.clientY-20;
  if(x+w>vw-8)x=ev.clientX-w-18;if(x<8)x=8;
  if(y+h>vh-8)y=vh-h-8;if(y<8)y=8;
  tt.style.left=x+'px';tt.style.top=y+'px';
}
function showTT(html,ev){if(!canHover)return;tt.innerHTML=html;tt.hidden=false;moveTT(ev)}
const hideTT=()=>{tt.hidden=true};

/* ---------- filters ---------- */
function matchQ(p){
  if(!state.q)return true;const q=state.q.toLowerCase();
  return (p.t+p.s+p.au+p.kw+p.ven).toLowerCase().includes(q);
}
function active(p){
  return state.tiers.has(p.tier)&&matchQ(p)&&!(state.unread&&read[p.id]);
}
const filtering=()=>state.q||state.unread||state.tiers.size<4;

/* ---------- tree ---------- */
const ROWH=30,COLW=250,M={l:150,r:280,t:24,b:24};
function drawTree(){
  const svg=d3.select('#svg');svg.selectAll('*').remove();
  const h=d3.hierarchy(root,d=>d.collapsed?null:d.children);
  d3.tree().nodeSize([ROWH,COLW])(h);
  let x0=Infinity,x1=-Infinity,dmax=0;
  h.each(d=>{x0=Math.min(x0,d.x);x1=Math.max(x1,d.x);dmax=Math.max(dmax,d.depth)});
  const W=M.l+dmax*COLW+M.r,H=x1-x0+M.t+M.b;
  svg.attr('viewBox',`0 0 ${W} ${H}`).attr('width',W*state.scale).attr('height',H*state.scale);
  const g=svg.append('g').attr('transform',`translate(${M.l},${M.t-x0})`);
  g.append('g').selectAll('path').data(h.links()).join('path').attr('class','link')
    .attr('d',d3.linkHorizontal().x(d=>d.y).y(d=>d.x));
  const pos={};h.each(d=>{if(d.data.paper)pos[d.data.id]=d});
  const edgeG=g.append('g');
  const drawEdges=()=>{
    edgeG.selectAll('*').remove();
    const list=E.filter(e=>pos[e[0]]&&pos[e[1]]&&(state.edges||e[0]===state.sel||e[1]===state.sel));
    edgeG.selectAll('path').data(list).join('path').attr('class','xedge').attr('d',e=>{
      const a=pos[e[0]],b=pos[e[1]];const off=70;
      return `M${a.y},${a.x}C${a.y+off},${a.x} ${b.y+off},${b.x} ${b.y},${b.x}`;});
  };
  drawEdges();
  const node=g.append('g').selectAll('g').data(h.descendants()).join('g')
    .attr('class',d=>{
      let c='node'+(d.data.paper?'':' grp');
      if(d.data.paper){const p=P[d.data.id];if(filtering()&&!active(p))c+=' dim';if(read[p.id])c+=' read';if(state.sel===p.id)c+=' sel'}
      return c}).attr('transform',d=>`translate(${d.y},${d.x})`)
    .attr('tabindex',0).attr('role','button')
    .attr('aria-label',d=>d.data.paper?P[d.data.id].t:d.data.name);
  node.each(function(d){
    const s=d3.select(this);
    if(d.data.paper){
      const p=P[d.data.id];const r={1:9,2:7.5,3:6,4:4.6}[p.tier];
      s.append('circle').attr('class','main').attr('r',r)
        .attr('fill',p.tier===4?'var(--surface)':`var(--t${p.tier})`)
        .attr('stroke',p.tier===4?'var(--t4)':`var(--t${p.tier})`).attr('stroke-width',p.tier===4?1.8:1);
      const t=s.append('text').attr('x',r+7).attr('dy','0.33em');
      t.append('tspan').attr('class','ordt').text(String(p.ord).padStart(2,'0')+'  ');
      t.append('tspan').attr('class','ttl').text(p.s+(read[p.id]?'  ✓':''));
      s.on('mouseenter',ev=>showTT(cardHTML(p,false),ev)).on('mousemove',moveTT).on('mouseleave',hideTT)
       .on('click',()=>{hideTT();select(p.id)}).on('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select(p.id)}});
    }else{
      const hidden=d.data.collapsed?countLeaves(d.data):0;
      s.append('rect').attr('x',-6).attr('y',-6).attr('width',12).attr('height',12).attr('rx',3)
        .attr('fill',d.depth===0?'var(--accent)':'var(--surface2)').attr('stroke','var(--accent)').attr('stroke-width',1.5);
      s.append('text').attr('x',-12).attr('text-anchor','end').attr('dy','0.33em')
        .text(d.data.name+(hidden?`  (+${hidden})`:''));
      const toggle=()=>{if(d.data.children){d.data.collapsed=!d.data.collapsed;drawTree()}};
      s.on('mouseenter',ev=>showTT(`<h3>${d.data.name}</h3><div>${d.data.desc}</div>${d.data.children?'<div class="meta">点击展开或折叠</div>':''}`,ev)).on('mousemove',moveTT).on('mouseleave',hideTT)
       .on('click',()=>{hideTT();toggle()}).on('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();toggle()}});
    }
  });
}
function countLeaves(n){let c=0;walk(n,x=>{if(x.paper)c++});return c}
function setAll(v,onlyDeep){walk(root,n=>{if(n.children&&n!==root){n.collapsed=onlyDeep?(n.children.some(c=>c.children)?false:v):v}})}

/* ---------- route ---------- */
function renderRoute(){
  const box=$('#routeView');
  box.innerHTML=STAGES.map(([a,b,name])=>{
    const items=ALL.filter(p=>p.ord>=a&&p.ord<=b&&active(p));
    if(!items.length)return '';
    return `<div class="stage"><h2>${name}</h2>${items.map(p=>`
      <button class="row${read[p.id]?' read':''}${state.sel===p.id?' sel':''}" data-id="${p.id}">
        <span class="n">${String(p.ord).padStart(2,'0')}</span>
        <span class="t">${p.t}</span>
        <span class="r">${tierTag(p.tier)}</span>
        <span class="w">${p.yr} · ${p.ven}。${p.why}</span>
      </button>`).join('')}</div>`}).join('')||'<div class="empty">没有符合筛选条件的论文。</div>';
  box.querySelectorAll('.row').forEach(b=>b.onclick=()=>select(b.dataset.id));
}

/* ---------- chrome ---------- */
function refresh(){
  const n=ALL.length,k=ALL.filter(p=>read[p.id]).length;
  $('#progNum').textContent=`已读 ${k} / ${n}`;$('#progBar').style.width=(k/n*100)+'%';
  drawTree();renderRoute();
}
function setTab(t){
  state.tab=t;
  $('#tabTree').setAttribute('aria-selected',t==='tree');$('#tabRoute').setAttribute('aria-selected',t==='route');
  $('#treeView').hidden=t!=='tree';$('#routeView').hidden=t!=='route';$('#treeTools').hidden=t!=='tree';
  hideTT();
}
$('#tabTree').onclick=()=>setTab('tree');$('#tabRoute').onclick=()=>setTab('route');
$('#tierChips').innerHTML=[1,2,3,4].map(t=>`<button class="chip" data-t="${t}" aria-pressed="true"><span class="dot t${t}"></span>${TIERS[t].name}</button>`).join('');
document.querySelectorAll('#tierChips .chip').forEach(b=>b.onclick=()=>{
  const t=+b.dataset.t;if(state.tiers.has(t))state.tiers.delete(t);else state.tiers.add(t);
  b.setAttribute('aria-pressed',state.tiers.has(t));refresh()});
$('#legend').innerHTML=[1,2,3,4].map(t=>`<span><span class="dot t${t}"></span> ${TIERS[t].name}:${TIERS[t].desc}</span>`).join('');
$('#q').addEventListener('input',e=>{state.q=e.target.value.trim();refresh()});
$('#bUnread').onclick=e=>{state.unread=!state.unread;e.currentTarget.setAttribute('aria-pressed',state.unread);refresh()};
$('#bEdges').onclick=e=>{state.edges=!state.edges;e.currentTarget.setAttribute('aria-pressed',state.edges);drawTree()};
$('#bExpand').onclick=()=>{walk(root,n=>{if(n.children)n.collapsed=false});drawTree()};
$('#bCollapse').onclick=()=>{walk(root,n=>{if(n.children&&n!==root)n.collapsed=(n.children.some(c=>c.children)?false:true)});drawTree()};
$('#bZoomIn').onclick=()=>{state.scale=Math.min(1.5,state.scale+.15);drawTree()};
$('#bZoomOut').onclick=()=>{state.scale=Math.max(.5,state.scale-.15);drawTree()};
addEventListener('scroll',hideTT,true);
if(innerWidth<700)state.scale=.8;
refresh();
</script>

</body></html>
